[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financelm"
version = "0.1.0"
description = "A financial language model built with PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.15.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["financelm*"]
